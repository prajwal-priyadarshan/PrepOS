<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepOS</title>
    <script>
      /* Stamp the theme before the first paint.
       *
       * Anything later - main.tsx, a React effect - is one frame too late, and
       * that frame is a white flash in a dark room every single launch. Kept
       * inline and duplicated from src/lib/theme.ts on purpose: an import here
       * would be a network round trip, which is the thing being avoided. */
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem('prepos.theme');
        } catch {
          /* Storage can be unavailable. The system preference is a fine answer. */
        }
        /* An explicit 'light', 'dark' or 'black' is kept as-is. Anything else -
         * never-set, hand edited, from an older build - falls back to the OS
         * preference; there is no OS notion of 'black' to defer to. */
        if (saved === 'light' || saved === 'dark' || saved === 'black') {
          document.documentElement.dataset.theme = saved;
        } else {
          const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
